name: Windows checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
      - name: Build owned Windows AirPlay backend
        shell: msys2 {0}
        run: mkdir -p build && bash tools/build-airplay.sh
      - name: Build native source, desktop, IPC checks and setup EXE
        shell: pwsh
        run: ./tools/build.ps1 -Installer
      - name: Prepare WinGet candidate from the built installer
        shell: pwsh
        run: |
          ./tools/New-WinGetManifest.ps1 -InstallerPath ./dist/Kagami-Setup-0.1.0-dev-x64.exe -InstallerUrl https://github.com/celestial-sora/kagami-win/releases/download/v0.1.0-dev/Kagami-Setup-0.1.0-dev-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kagami-windows-development-${{ github.sha }}
          path: |
            dist/
            build/SHA256SUMS
            build/ui-preview.png
            build/winget/
          if-no-files-found: error
