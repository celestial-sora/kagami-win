name: Windows checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native source, desktop, IPC checks and setup EXE
        shell: pwsh
        run: ./tools/build.ps1 -Installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kagami-windows-development-${{ github.sha }}
          path: |
            dist/
            build/SHA256SUMS
          if-no-files-found: error
